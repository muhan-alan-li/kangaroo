# Workday boards removed as structurally dead, by server/jobs/retry/prune.py.
#
# A board lands here when it is `broken` on a structural failure (a Workday 404/422 -- a
# wrong career-site name no retry can fix). `server/jobs/harvest/workday.py` reads this
# list and skips these triples when it rebuilds data/config/workday_boards.yaml from the feed,
# because the dead triples came from feed URLs and would otherwise be re-added on the
# next harvest. Remove a line by hand to let a board back in (e.g. the employer fixed
# the career-site name).
#
#     python3 -m server harvest workday
#

tombstones:
  - {key: fragomen|wd1|FragomenCareers, tenant: fragomen, wd: wd1, site: FragomenCareers, pruned_at: 2026-10-19T05:00:21+00:00, reason: "HTTPError: HTTP Error 422: Unprocessable Entity"}
  - {key: netflix|wd1|Netflix, tenant: netflix, wd: wd1, site: Netflix, pruned_at: 2026-10-19T05:00:21+00:00, reason: "HTTPError: HTTP Error 422: Unprocessable Entity"}
  - {key: vca|wd1|antechcareers, tenant: vca, wd: wd1, site: antechcareers, pruned_at: 2026-10-19T05:00:21+00:00, reason: "HTTPError: HTTP Error 422: Unprocessable Entity"}
  - {key: vhr-genband|wd1|ribboncareers, tenant: vhr-genband, wd: wd1, site: ribboncareers, pruned_at: 2026-10-19T05:00:21+00:00, reason: "HTTPError: HTTP Error 422: Unprocessable Entity"}

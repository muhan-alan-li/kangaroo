[package]
name = "jh-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# Zed's UI framework. The `gpui` 0.2.x release on crates.io is the older
# published line; `gpui-component` 0.9.1 is built against the `gpui-pre`
# snapshot of zed@d2a4fb6ded7c470be25d1541281da3882495b65b, which is published
# as the exact version 0.3.12, so the spike takes that package under the
# `gpui` name.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# The platform backend (window, run loop, Metal renderer) lives in its own
# snapshot crate and is what provides `application()`.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
# gpui-component 0.9.1, tag v0.9.1 of longbridge/gpui-kit.
gpui_component = { package = "gpui-component", git = "https://github.com/longbridge/gpui-kit", rev = "39ab849a93b5f15507b969164d49891db8d5b470" }
# The status item hands menu clicks to the GPUI main loop over a channel.
flume = "0.12"
chrono.workspace = true
jh-engine = { path = "../jh-engine" }

# The macOS menu bar status item is written directly against AppKit; these are
# the same objc2 versions gpui-component already links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSApplication",
    "NSRunningApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

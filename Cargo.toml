[workspace]
resolver = "3"
members = [
    "crates/jh-core",
    "crates/jh-db",
    "crates/jh-cli",
    "crates/jh-scan",
    "crates/jh-engine",
    "crates/jh-app",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls-native-roots"] }
libc = "0.2"

[profile.release]
lto = "thin"
